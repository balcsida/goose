# Experimental Tauri build pipeline for cross-platform desktop app packaging.
# This is a separate pipeline from the Electron-based builds, intended for
# testing and validating the Tauri migration.
#
# Supports:
#   macOS   — arm64 (Apple Silicon) + x64 (Intel)
#   Windows — x64 + arm64 (cross-compiled from x64)
#   Linux   — x64 + arm64 (native on ARM runner)
#
# Produces:
#   macOS   — .dmg, .app (zipped)
#   Windows — .msi, .exe (NSIS)
#   Linux   — .deb, .rpm, .AppImage, .flatpak
name: "Tauri Build (Experimental)"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        required: true
        type: string
        default: "feat/electron-to-tauri"
      version:
        description: "Version override (leave empty to use Cargo.toml)"
        required: false
        type: string
        default: ""
      platforms:
        description: "Platforms to build"
        required: true
        type: choice
        options:
          - all
          - macos-arm64
          - macos-x64
          - windows-x64
          - windows-arm64
          - linux-x64
          - linux-arm64
        default: "all"

  # Also callable from other workflows (e.g. a future tauri-release.yml)
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: false
        type: string
        default: ""
      version:
        description: "Version to set for the build"
        required: false
        type: string
        default: ""
      platforms:
        description: "Platforms to build (all, macos-arm64, macos-x64, windows-x64, windows-arm64, linux-x64, linux-arm64)"
        required: false
        type: string
        default: "all"

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  NODE_VERSION: "24.10.0"
  PNPM_VERSION: "10.30.3"

# =============================================================================
# Helper anchors — these are referenced with *anchor in YAML but GitHub Actions
# doesn't support anchors, so we use composite-like step repetition instead.
# =============================================================================

jobs:
  # ---------------------------------------------------------------------------
  # macOS ARM64 (Apple Silicon)
  # ---------------------------------------------------------------------------
  tauri-macos-arm64:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'macos-arm64'))
      || (github.event_name != 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'macos-arm64' || inputs.platforms == ''))
    name: "Tauri · macOS arm64"
    runs-on: macos-latest
    steps:
      - name: Check disk space
        run: df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || inputs.ref || '' }}

      - name: Update version
        if: ${{ (inputs.version || '') != '' }}
        run: |
          VERSION="${{ inputs.version }}"
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml && rm -f Cargo.toml.bak
          cd ui/desktop/src-tauri
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" tauri.conf.json && rm -f tauri.conf.json.bak
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml && rm -f Cargo.toml.bak

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: tauri-macos-arm64
          workspaces: ui/desktop/src-tauri

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ui/desktop/node_modules
            ~/.pnpm-store
          key: tauri-pnpm-macos-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: tauri-pnpm-macos-

      - name: Install frontend dependencies
        working-directory: ui/desktop
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        working-directory: ui/desktop
        run: pnpm tauri build --target aarch64-apple-darwin

      - name: List build artifacts
        run: |
          echo "=== Bundle output ==="
          ls -lhR ui/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/ 2>/dev/null || true

      - name: Post-build cleanup
        run: |
          rm -rf ui/desktop/src-tauri/target/aarch64-apple-darwin/release/{deps,build,incremental} || true
          df -h

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Goose-Tauri-darwin-arm64-dmg
          path: ui/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Zip .app bundle
        run: |
          cd ui/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          if ls *.app 1>/dev/null 2>&1; then
            ditto -c -k --sequesterRsrc --keepParent *.app Goose-Tauri-arm64.zip
          fi

      - name: Upload .app zip
        uses: actions/upload-artifact@v4
        with:
          name: Goose-Tauri-darwin-arm64-app
          path: ui/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Goose-Tauri-arm64.zip
          if-no-files-found: warn

      - name: Quick launch test
        run: |
          APP_PATH=$(find ui/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app" -maxdepth 1 | head -1)
          if [ -n "$APP_PATH" ]; then
            xattr -cr "$APP_PATH"
            open -g "$APP_PATH"
            sleep 5
            APP_NAME=$(basename "$APP_PATH" .app)
            if pgrep -f "${APP_NAME}" > /dev/null; then
              echo "App is running."
              pkill -f "${APP_NAME}" || true
            else
              echo "App did not stay open — possible crash."
              exit 1
            fi
          else
            echo "No .app bundle found, skipping launch test."
          fi

  # ---------------------------------------------------------------------------
  # macOS x64 (Intel)
  # ---------------------------------------------------------------------------
  tauri-macos-x64:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'macos-x64'))
      || (github.event_name != 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'macos-x64' || inputs.platforms == ''))
    name: "Tauri · macOS x64"
    runs-on: macos-latest
    steps:
      - name: Check disk space
        run: df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || inputs.ref || '' }}

      - name: Update version
        if: ${{ (inputs.version || '') != '' }}
        run: |
          VERSION="${{ inputs.version }}"
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml && rm -f Cargo.toml.bak
          cd ui/desktop/src-tauri
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" tauri.conf.json && rm -f tauri.conf.json.bak
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml && rm -f Cargo.toml.bak

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: tauri-macos-x64
          workspaces: ui/desktop/src-tauri

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ui/desktop/node_modules
            ~/.pnpm-store
          key: tauri-pnpm-macos-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: tauri-pnpm-macos-

      - name: Install frontend dependencies
        working-directory: ui/desktop
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (Intel)
        working-directory: ui/desktop
        run: pnpm tauri build --target x86_64-apple-darwin

      - name: List build artifacts
        run: |
          echo "=== Bundle output ==="
          ls -lhR ui/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/ 2>/dev/null || true

      - name: Post-build cleanup
        run: |
          rm -rf ui/desktop/src-tauri/target/x86_64-apple-darwin/release/{deps,build,incremental} || true
          df -h

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Goose-Tauri-darwin-x64-dmg
          path: ui/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Zip .app bundle
        run: |
          cd ui/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos
          if ls *.app 1>/dev/null 2>&1; then
            ditto -c -k --sequesterRsrc --keepParent *.app Goose-Tauri-x64.zip
          fi

      - name: Upload .app zip
        uses: actions/upload-artifact@v4
        with:
          name: Goose-Tauri-darwin-x64-app
          path: ui/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Goose-Tauri-x64.zip
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Windows x64
  # ---------------------------------------------------------------------------
  tauri-windows-x64:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'windows-x64'))
      || (github.event_name != 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'windows-x64' || inputs.platforms == ''))
    name: "Tauri · Windows x64"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || inputs.ref || '' }}

      - name: Update version
        if: ${{ (inputs.version || '') != '' }}
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          cd ui/desktop/src-tauri
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: tauri-windows-x64
          workspaces: ui/desktop/src-tauri

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ui/desktop/node_modules
            ~\AppData\Local\pnpm\store
          key: tauri-pnpm-windows-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: tauri-pnpm-windows-

      - name: Install frontend dependencies
        working-directory: ui/desktop
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        working-directory: ui/desktop
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: List build artifacts
        shell: bash
        run: |
          echo "=== Bundle output ==="
          ls -lhR ui/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/ 2>/dev/null || true

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: Goose-Tauri-windows-x64-nsis
          path: ui/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: Goose-Tauri-windows-x64-msi
          path: ui/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Windows ARM64 (cross-compiled from x64 — no ARM64 runners available)
  # ---------------------------------------------------------------------------
  tauri-windows-arm64:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'windows-arm64'))
      || (github.event_name != 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'windows-arm64' || inputs.platforms == ''))
    name: "Tauri · Windows arm64"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || inputs.ref || '' }}

      - name: Update version
        if: ${{ (inputs.version || '') != '' }}
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          cd ui/desktop/src-tauri
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install ARM64 build tools
        shell: pwsh
        run: |
          # Visual Studio should already have ARM64 build tools on windows-latest.
          # Verify the target is available.
          rustup target list --installed
          rustup target add aarch64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: tauri-windows-arm64
          workspaces: ui/desktop/src-tauri

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ui/desktop/node_modules
            ~\AppData\Local\pnpm\store
          key: tauri-pnpm-windows-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: tauri-pnpm-windows-

      - name: Install frontend dependencies
        working-directory: ui/desktop
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (ARM64)
        working-directory: ui/desktop
        # Only NSIS supports ARM64 — MSI/WiX does not.
        run: pnpm tauri build --target aarch64-pc-windows-msvc --bundles nsis

      - name: List build artifacts
        shell: bash
        run: |
          echo "=== Bundle output ==="
          ls -lhR ui/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/ 2>/dev/null || true

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: Goose-Tauri-windows-arm64-nsis
          path: ui/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Linux x64
  # ---------------------------------------------------------------------------
  tauri-linux-x64:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'linux-x64'))
      || (github.event_name != 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'linux-x64' || inputs.platforms == ''))
    name: "Tauri · Linux x64"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || inputs.ref || '' }}

      - name: Update version
        if: ${{ (inputs.version || '') != '' }}
        run: |
          VERSION="${{ inputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          cd ui/desktop/src-tauri
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            flatpak \
            flatpak-builder \
            elfutils

      - name: Setup Flatpak
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: tauri-linux-x64
          workspaces: ui/desktop/src-tauri

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ui/desktop/node_modules
            ~/.pnpm-store
          key: tauri-pnpm-linux-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: tauri-pnpm-linux-

      - name: Install frontend dependencies
        working-directory: ui/desktop
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        working-directory: ui/desktop
        run: pnpm tauri build

      - name: List build artifacts
        run: |
          echo "=== Bundle output ==="
          find ui/desktop/src-tauri/target/release/bundle -type f \
            \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) 2>/dev/null || true
          ls -lhR ui/desktop/src-tauri/target/release/bundle/ 2>/dev/null || true

      - name: Build Flatpak
        run: |
          cd ui/desktop/src-tauri

          # Locate the built binary
          BINARY="target/release/goose-desktop"
          if [ ! -f "$BINARY" ]; then
            echo "Binary not found at $BINARY, searching..."
            BINARY=$(find target/release -maxdepth 1 -name "goose-desktop" -o -name "Goose" | head -1)
          fi

          if [ -z "$BINARY" ] || [ ! -f "$BINARY" ]; then
            echo "WARNING: Could not find Tauri binary for Flatpak. Skipping."
            exit 0
          fi

          # Prepare a staging directory with all files the manifest expects
          STAGE=$(mktemp -d)
          cp "$BINARY" "$STAGE/goose-desktop"
          chmod +x "$STAGE/goose-desktop"
          cp icons/128x128.png "$STAGE/icon-128.png"
          cp io.github.block.Goose.desktop "$STAGE/"
          cp io.github.block.Goose.metainfo.xml "$STAGE/"

          # Rewrite the manifest to point sources at the staging dir
          sed "s|path: goose-desktop|path: $STAGE/goose-desktop|;s|path: icon-128.png|path: $STAGE/icon-128.png|;s|path: io.github.block.Goose.desktop|path: $STAGE/io.github.block.Goose.desktop|;s|path: io.github.block.Goose.metainfo.xml|path: $STAGE/io.github.block.Goose.metainfo.xml|" \
            io.github.block.Goose.yml > "$STAGE/manifest.yml"

          # Build the flatpak bundle
          flatpak-builder --user --install --force-clean \
            flatpak-build "$STAGE/manifest.yml"

          flatpak build-bundle \
            ~/.local/share/flatpak/repo \
            Goose-Tauri-x64.flatpak \
            io.github.block.Goose

          echo "Flatpak bundle created:"
          ls -lh Goose-Tauri-x64.flatpak

      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: Goose-Tauri-linux-x64-deb
          path: ui/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

      - name: Upload .rpm package
        uses: actions/upload-artifact@v4
        with:
          name: Goose-Tauri-linux-x64-rpm
          path: ui/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Goose-Tauri-linux-x64-appimage
          path: ui/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: Goose-Tauri-linux-x64-flatpak
          path: ui/desktop/src-tauri/Goose-Tauri-x64.flatpak
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Linux ARM64 (native build on ARM runner)
  # ---------------------------------------------------------------------------
  tauri-linux-arm64:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'linux-arm64'))
      || (github.event_name != 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'linux-arm64' || inputs.platforms == ''))
    name: "Tauri · Linux arm64"
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || inputs.ref || '' }}

      - name: Update version
        if: ${{ (inputs.version || '') != '' }}
        run: |
          VERSION="${{ inputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          cd ui/desktop/src-tauri
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: tauri-linux-arm64
          workspaces: ui/desktop/src-tauri

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ui/desktop/node_modules
            ~/.pnpm-store
          key: tauri-pnpm-linux-arm64-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: tauri-pnpm-linux-arm64-

      - name: Install frontend dependencies
        working-directory: ui/desktop
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        working-directory: ui/desktop
        run: pnpm tauri build

      - name: List build artifacts
        run: |
          echo "=== Bundle output ==="
          find ui/desktop/src-tauri/target/release/bundle -type f \
            \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) 2>/dev/null || true
          ls -lhR ui/desktop/src-tauri/target/release/bundle/ 2>/dev/null || true

      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: Goose-Tauri-linux-arm64-deb
          path: ui/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

      - name: Upload .rpm package
        uses: actions/upload-artifact@v4
        with:
          name: Goose-Tauri-linux-arm64-rpm
          path: ui/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Goose-Tauri-linux-arm64-appimage
          path: ui/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Summary — collects all artifacts into one place
  # ---------------------------------------------------------------------------
  summary:
    name: "Build Summary"
    runs-on: ubuntu-latest
    needs:
      - tauri-macos-arm64
      - tauri-macos-x64
      - tauri-windows-x64
      - tauri-windows-arm64
      - tauri-linux-x64
      - tauri-linux-arm64
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: Goose-Tauri-*

      - name: List all artifacts
        run: |
          echo "========================================"
          echo "  Tauri Build Summary"
          echo "========================================"
          for platform in darwin-arm64 darwin-x64 windows-x64 windows-arm64 linux-x64 linux-arm64; do
            echo ""
            echo "${platform}:"
            ls -lh all-artifacts/Goose-Tauri-${platform}-*/ 2>/dev/null || echo "  (not built or no artifacts)"
          done
          echo ""
          echo "========================================"

      - name: Report job results
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<'EOF'
          ### Tauri Build Results

          | Platform | Status |
          |----------|--------|
          | macOS arm64 | ${{ needs.tauri-macos-arm64.result }} |
          | macOS x64 | ${{ needs.tauri-macos-x64.result }} |
          | Windows x64 | ${{ needs.tauri-windows-x64.result }} |
          | Windows arm64 | ${{ needs.tauri-windows-arm64.result }} |
          | Linux x64 | ${{ needs.tauri-linux-x64.result }} |
          | Linux arm64 | ${{ needs.tauri-linux-arm64.result }} |
          EOF
